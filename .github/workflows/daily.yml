name: Daily AI News Digest

on:
  schedule:
    # Runs every day at 07:00 UTC — edit this to change the time
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py

      - name: Commit updated dashboard and archive
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          git add docs/index.html data/*.json
          git diff --staged --quiet || git commit -m "Daily AI news update $(date -u +%Y-%m-%d)"
          git push
